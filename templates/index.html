<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Portfolio Blackbox</title>

  <script defer src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet" />
</head>

<body>
<main class="app-shell">
  <header class="app-header">
    <div>
      <p class="eyebrow">Personal Portfolio Analytics</p>
      <h1>Portfolio Blackbox</h1>
      <p class="app-subtitle">계좌 흐름, 성과 원인, 리스크 변화를 데이터로 복기합니다.</p>
    </div>
    <div class="account-total privacy-sensitive" id="total-value"></div>
  </header>

  <section class="market-strip" id="market-cards"></section>

  <nav class="section-tabs" id="dashboard-tabs" aria-label="dashboard navigation">
    <button class="nav-link active" id="tab-dashboard" onclick="showTab('dashboard')" type="button">계좌 복기</button>
    <button class="nav-link" id="tab-data" onclick="showTab('data')" type="button">시장과 예측</button>
    <button class="nav-link" id="tab-watchlist" onclick="showTab('watchlist')" type="button">관심목록</button>
  </nav>

  {% include "partials/_dashboard.html" %}
  {% include "partials/_data.html" %}
  {% include "partials/_watchlist.html" %}
</main>

{% include "partials/_scripts.html" %}
</body>
</html>
