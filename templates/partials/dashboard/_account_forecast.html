<div class="section-heading">
  <div>
    <p class="eyebrow">Forecast Review</p>
    <h2>예측 검토</h2>
  </div>
</div>

<section class="panel" id="account-forecast-card">
  <div class="panel-heading">
    <h3>계좌 총자산 예측</h3>
    <span>예측은 매매 판단이 아니라 계좌 흐름을 해석하는 보조 데이터입니다.</span>
  </div>

  <div class="control-row">
    <div>
      <label class="form-label mb-1" for="account-horizon">예측 일수</label>
      <select class="form-select form-select-sm" id="account-horizon">
        <option value="5">5일</option>
        <option selected value="7">7일</option>
        <option value="14">14일</option>
        <option value="21">21일</option>
      </select>
    </div>

    <div>
      <label class="form-label mb-1" for="account-backtest-days">평가 구간</label>
      <select class="form-select form-select-sm" id="account-backtest-days">
        <option value="10">10일</option>
        <option value="20">20일</option>
        <option selected value="30">30일</option>
        <option value="60">60일</option>
      </select>
    </div>

    <fieldset class="model-group">
      <legend>모델 선택</legend>
      <label><input checked class="form-check-input account-model-check" type="checkbox" value="linear"> Linear</label>
      <label><input checked class="form-check-input account-model-check" type="checkbox" value="holt"> Holt</label>
      <label><input checked class="form-check-input account-model-check" type="checkbox" value="arima"> ARIMA</label>
    </fieldset>

    <div class="button-row">
      <button class="btn btn-primary btn-sm" id="account-refresh-btn">다시 그리기</button>
      <button class="btn btn-success btn-sm" id="account-save-btn">예측 저장</button>
      <button class="btn btn-warning btn-sm" id="account-update-actuals-btn">실제값 반영</button>
    </div>
  </div>

  <div class="status-row">
    <div id="account-save-status"></div>
    <div id="account-actuals-status"></div>
  </div>

  <div class="chart-box" id="account-forecast-chart"></div>
  <div class="metrics-table" id="account-forecast-metrics"></div>

  <div class="table-section-header">
    <h4 class="table-title">계좌 예측 이력</h4>
    <button class="btn btn-outline-secondary btn-sm" id="account-history-refresh-btn">이력 새로고침</button>
  </div>
  <div id="account-history-table"></div>
</section>
