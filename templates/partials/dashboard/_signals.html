<div class="section-heading">

    <h2>이상징후</h2>
  </div>
</div>

<section class="panel" id="signals-card">
  <div class="panel-heading">
    <h3>계좌 이상징후</h3>

  </div>
  <div class="metric-grid" id="signals-summary"></div>

  <div class="layout-two layout-narrow-left">

      <div class="table-scroll">
        <table class="table table-bordered table-sm">

        <table class="table table-bordered table-sm">
          <thead>
          <tr>
            <th>날짜</th>
            <th>신호</th>
            <th>변화금액</th>
            <th>변화율</th>
