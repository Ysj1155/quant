<div class="section-heading">
  <div>
    <p class="eyebrow">Attribution</p>
    <h2>성과 분석</h2>
  </div>
</div>

<section class="panel" id="performance-card">
  <div class="panel-heading">
    <h3>성과 증거실</h3>
    <span>회고에 쓸 수 있는 성과 근거를 숫자와 표로 확인합니다.</span>
  </div>
  <div class="metric-grid" id="performance-summary"></div>
  <div class="metric-grid compact-grid" id="performance-advanced-summary"></div>

  <div class="report-block">
    <h4 class="table-title">복기 근거 카드</h4>
    <div class="evidence-grid" id="performance-evidence-cards"></div>
  </div>

  <div class="layout-two">
    <div>
      <h4 class="table-title">이익 기여 상위</h4>
      <div class="table-scroll">
        <table class="table table-bordered table-sm">
          <thead>
          <tr>
            <th>종목</th>
            <th>자산군</th>
            <th>평가손익</th>
            <th>손익률</th>
            <th>비중</th>
          </tr>
          </thead>
          <tbody id="performance-gainers-body"></tbody>
        </table>
      </div>
    </div>

    <div>
      <h4 class="table-title">손실 기여 상위</h4>
      <div class="table-scroll">
        <table class="table table-bordered table-sm">
          <thead>
          <tr>
            <th>종목</th>
            <th>자산군</th>
            <th>평가손익</th>
            <th>손익률</th>
            <th>비중</th>
          </tr>
          </thead>
          <tbody id="performance-losers-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="layout-two">
    <div>
      <h4 class="table-title">자산군별 성과</h4>
      <div class="table-scroll">
        <table class="table table-bordered table-sm">
          <thead>
          <tr>
            <th>자산군</th>
            <th>종목수</th>
            <th>평가금액</th>
            <th>비중</th>
            <th>평가손익</th>
            <th>손익률</th>
          </tr>
          </thead>
          <tbody id="performance-assets-body"></tbody>
        </table>
      </div>
    </div>

    <div>
      <h4 class="table-title">월별 계좌 변화</h4>
      <div class="table-scroll">
        <table class="table table-bordered table-sm">
          <thead>
          <tr>
            <th>월</th>
            <th>월말 평가총액</th>
            <th>변화금액</th>
            <th>변화율</th>
          </tr>
          </thead>
          <tbody id="performance-monthly-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>
