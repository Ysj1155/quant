<section class="panel" id="reflection-log-card">
  <div class="panel-head">
    <div>
      <h3>주간 회고 로그</h3>
      <p id="reflection-log-status">최신 스냅샷 기준으로 이번주 회고 작업대를 준비합니다.</p>
    </div>
    <div class="button-row">
      <button class="btn btn-sm btn-outline-secondary" id="reflection-log-save-button" type="button">자동 요약 갱신</button>
      <button class="btn btn-sm btn-primary" id="reflection-log-memo-save-button" type="button">내 메모 저장</button>
    </div>
  </div>

  <div class="log-focus-grid">
    <div class="log-editor-panel">
      <div class="report-editor-toolbar">
        <div>
          <h4 id="reflection-log-editor-title">이번주 내 생각</h4>
          <div class="muted" id="reflection-log-editor-meta">주간 파일을 만들면 자동 요약과 함께 저장됩니다.</div>
        </div>
      </div>

      <div class="report-tag-row">
        <label for="reflection-log-tags-input">태그</label>
        <input id="reflection-log-tags-input" type="text" placeholder="예: 리밸런싱 환율영향 현금비중">
      </div>

      <div class="report-editor always-open">
        <label for="reflection-log-manual-editor">수동 메모</label>
        <textarea id="reflection-log-manual-editor" rows="14"></textarea>
      </div>
    </div>

    <aside class="log-side-panel">
      <h4>빠진 주</h4>
      <div id="reflection-log-missing-list" class="report-file-list"></div>

      <h4>최근 로그</h4>
      <div id="reflection-log-file-list" class="report-file-list"></div>
    </aside>
  </div>

  <details class="log-evidence-panel">
    <summary>자동 요약과 다음 질문</summary>
    <div class="metric-grid compact-grid" id="reflection-log-summary"></div>
    <div class="report-block">
      <h4>계산 기준 주간 자동 요약</h4>
      <ul class="report-list" id="reflection-log-narrative"></ul>
    </div>
    <div class="report-block">
      <h4>다음 질문</h4>
      <ul class="report-list compact" id="reflection-log-questions"></ul>
    </div>
  </details>
</section>
