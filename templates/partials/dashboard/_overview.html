<div class="section-heading">
  <div>
    <p class="eyebrow">Overview</p>
    <h2>계좌 개요</h2>
  </div>
  <button class="btn btn-secondary btn-sm" id="toggle-privacy-btn">정보 숨기기</button>
</div>

<div class="layout-two layout-wide-left">
  <section class="panel">
    <div class="panel-heading">
      <h3>총자산과 기간 수익률</h3>
      <span>총자산 레벨과 기간 수익률을 분리해 보고, 날짜를 클릭해 상세 내역을 확인합니다.</span>
    </div>
    <div class="chart-box chart-box-large" id="profit-chart"></div>
  </section>

  <section class="panel">
    <div class="panel-heading">
      <h3>자산 노출</h3>
      <div class="panel-actions">
        <span id="exposure-mode-label">자산군 기준</span>
        <div class="segmented-control" aria-label="asset exposure mode">
          <button class="segmented-button active" data-exposure-mode="asset_type" type="button">자산군</button>
          <button class="segmented-button" data-exposure-mode="holding" type="button">종목</button>
          <button class="segmented-button" data-exposure-mode="currency" type="button">통화</button>
        </div>
      </div>
    </div>
    <div class="chart-box chart-box-compact" id="pie-chart"></div>
  </section>
</div>

<section class="panel">
  <div class="panel-heading">
    <h3>보유 종목</h3>
    <span>현재 스냅샷 기준 포지션입니다.</span>
  </div>
  <div class="table-scroll">
    <table class="table table-bordered table-sm align-middle privacy-sensitive">
      <thead>
      <tr>
        <th>계좌</th>
        <th>종목</th>
        <th>수량</th>
        <th>매입금액</th>
        <th>평가금액</th>
        <th>평가손익</th>
        <th>손익률</th>
      </tr>
      </thead>
      <tbody id="portfolio-table-body"></tbody>
    </table>
  </div>
</section>
